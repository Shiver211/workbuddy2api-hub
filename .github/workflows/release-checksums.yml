name: release-checksums

# 为已发布的 Windows 应用包生成 checksums.txt。
#
# If the zip is uploaded *after* the release is published, re-run this
# workflow from the Actions tab with the tag as input.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to hash (e.g. v1.6.10)"
        required: true

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  checksums:
    runs-on: windows-latest
    steps:
      - name: Resolve the release tag
        id: rel
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ github.event.inputs.tag }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          gh release download "${{ steps.rel.outputs.tag }}" --dir dist --clobber
      - name: checksums
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne 'checksums.txt' })
          if ($assets.Count -eq 0) { throw 'Release 没有可计算校验和的资产' }
          $assets | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/checksums.txt -Encoding utf8
      - name: Upload checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" dist/checksums.txt --clobber
