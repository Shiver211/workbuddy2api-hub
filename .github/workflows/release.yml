name: release

# Windows 便携包：版本检查 -> 完整测试矩阵 -> 打包与冒烟 -> 校验和 -> 草稿发布。
# 手动运行仅打包；只有 v* tag 推送可创建草稿，发布仍由维护者完成。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（手动运行只做打包演练，不创建/更新任何 release）"
        required: true

permissions:
  contents: write

# A release must not be built twice at once, and an in-flight run is worth
# finishing (it is about to upload assets), so unlike tests.yml this one does
# not cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  CHECKOUT_REF: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  # Belt and braces next to the scripts' own reconfigure: every Python process
  # in the job reads and writes utf-8 whatever the runner locale is. The
  # Windows runner's console is cp1252, which is what killed the first
  # rehearsal at the first Chinese summary line.
  PYTHONUTF8: "1"

jobs:
  # ---- 1. tag == source version -------------------------------------------
  # Same assertion tests.yml makes, repeated here because the release must not
  # depend on another workflow's file staying shaped the way it is today.
  version:
    name: tag matches source version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      rehearsal: ${{ steps.v.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Assert tag == source version
        id: v
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content wb_proxy.py -Raw
          $OVERVIEW = [regex]::Match($source, '"version"\s*:\s*"([^"]+)"').Groups[1].Value
          $SERVER = [regex]::Match($source, 'server_version\s*=\s*"wb-proxy/([^"]+)"').Groups[1].Value
          if (-not $OVERVIEW -or $OVERVIEW -ne $SERVER) { throw "源码版本不一致" }
          $TAGVER = $env:TAG -replace '^v', ''
          $REHEARSAL = $env:TAG.EndsWith('-ci')
          if (-not $REHEARSAL -and $TAGVER -ne $OVERVIEW) { throw "tag 与源码版本不一致" }
          "version=$OVERVIEW" >> $env:GITHUB_OUTPUT
          "rehearsal=$($REHEARSAL.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  # ---- 2. the gate every release-writing path must pass --------------------
  gate:
    name: required tests
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      # Set by the step that actually checks every leg, not by `decide`: an
      # output wired to the wrong step is empty, and the draft job then refuses
      # the write - which is how this was caught the first time it ran.
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Decide what this run is allowed to do
        id: decide
        run: |
          $writes = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}'.StartsWith('refs/tags/v')
          "writes=$($writes.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Require the full matrix for this commit
        # Only a full matrix may authorise a release mutation. The legs come
        # from tests.yml, so a leg dropped there cannot silently weaken this.
        id: matrix
        if: steps.decide.outputs.writes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ github.sha }}'
          $expected = @(python release/matrix_legs.py)
          if ($LASTEXITCODE -ne 0 -or $expected.Count -eq 0) { throw '测试矩阵解析失败' }
          $wf = gh api "/repos/$env:GH_REPO/actions/workflows" --jq '.workflows[] | select(.path == ".github/workflows/tests.yml") | .id'
          if ($LASTEXITCODE -ne 0 -or -not $wf) { throw '找不到 tests 工作流' }
          $run = $null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $runs = gh api "/repos/$env:GH_REPO/actions/workflows/$wf/runs?head_sha=$sha&per_page=50" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw '无法读取测试运行' }
            $run = $runs.workflow_runs | Where-Object { $_.event -in @('push', 'pull_request') } | Sort-Object created_at -Descending | Select-Object -First 1
            if ($run) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $run) { throw '目标提交没有 tests 运行' }
          for ($attempt = 0; $attempt -lt 150; $attempt++) {
            $run = gh api "/repos/$env:GH_REPO/actions/runs/$($run.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw '无法读取测试状态' }
            if ($run.status -eq 'completed') { break }
            Start-Sleep -Seconds 20
          }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw '完整测试矩阵未通过' }
          $jobs = gh api "/repos/$env:GH_REPO/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '无法读取测试任务' }
          foreach ($leg in $expected) {
            if (-not ($jobs.jobs | Where-Object { $_.name -eq $leg -and $_.conclusion -eq 'success' })) { throw "测试未通过: $leg" }
          }
          'matrix=full' >> $env:GITHUB_OUTPUT
      - name: Run every suite (packaging-only dry run has no tag-triggered matrix)
        if: steps.decide.outputs.writes != 'true'
        run: python tests/run_all.py --jobs 4

  # Windows 应用包使用系统 Python 实际启动。
  portable:
    name: portable zip
    needs: [version, gate]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the portable archive
        shell: pwsh
        run: |
          python release/release_tools.py portable `
            --version "${{ needs.version.outputs.version }}" `
            --tag "$env:TAG" `
            --out "dist/workbuddy2api-hub-v${{ needs.version.outputs.version }}.zip"
      - name: Boot the application with system Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $mb = [math]::Round($zip.Length / 1MB, 1)
          Write-Host "package: $($zip.Name) ($mb MB)"

          # Unpack outside the checkout: the smoke test is not allowed to leave
          # anything behind in the repository.
          $stage = Join-Path $env:RUNNER_TEMP ('smoke-' + [guid]::NewGuid())
          Expand-Archive -Path $zip.FullName -DestinationPath $stage -Force
          if (-not (Test-Path (Join-Path $stage 'release-manifest.json'))) {
            throw "包内没有 release-manifest.json"
          }
          $root = Join-Path $stage 'wb-proxy'
          if (-not (Test-Path $root)) { throw "包内没有 wb-proxy/ 目录" }
          $py = (Get-Command python).Source
          if (-not (Test-Path (Join-Path $root 'console_tail.py'))) {
            throw "包内没有 console_tail.py（静默模式的日志窗口依赖它）"
          }

          & $py --version
          if ($LASTEXITCODE -ne 0) { throw "系统 Python 无法执行" }
          Push-Location $root
          try {
            & $py -c "import wb_proxy, wb_accounts, wb_pricing, wb_atrest, wb_webagent, wb_webtools, wb_scheduler, wb_tasks; print('app imports ok')"
            if ($LASTEXITCODE -ne 0) { throw "系统 Python 无法载入应用模块" }
          } finally { Pop-Location }

          $outLog = Join-Path $env:RUNNER_TEMP 'smoke-out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'smoke-err.log'
          $proc = Start-Process -FilePath $py `
            -ArgumentList 'wb_proxy.py', '--host', '127.0.0.1', '--port', '8799' `
            -WorkingDirectory $root -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:8799/health' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "health: $($r.Content)"; break }
              } catch { }
            }
            if (-not $ok) {
              Write-Host "--- stdout ---"; Get-Content $outLog -ErrorAction SilentlyContinue
              Write-Host "--- stderr ---"; Get-Content $errLog -ErrorAction SilentlyContinue
              throw "便携包启动后 /health 没有响应"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "application package boots with system Python: $($zip.Name)"
      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/*.zip
          if-no-files-found: error

  draft-preview:
    name: draft preview
    needs: [version, gate, portable]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS from the final assets
        run: |
          $assets = @(Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw '缺少 Windows 便携包' }
          python release/release_tools.py checksums --out dist/SHA256SUMS @assets
      - name: Compose the release body (maintainer notes above the fixed block)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existing = gh release view "$env:TAG" --json body --jq .body 2>$null
          if ($LASTEXITCODE -ne 0) { $existing = '' }
          $existing | Set-Content dist/existing-body.md -Encoding utf8
          python release/release_tools.py body --version "${{ needs.version.outputs.version }}" --existing dist/existing-body.md --out dist/release-body.md
      - name: Show what a tag push would do
        # A manual run stops here on purpose. The commands are printed, not
        # run: reaching the writer takes a v* tag.
        if: github.event_name == 'workflow_dispatch'
        run: |
          Write-Host '打包演练完成：未创建或修改 Release。推送版本 tag 后，经 Windows 3.9 / 3.12 测试通过才会生成草稿。'
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/SHA256SUMS
            dist/release-body.md
          if-no-files-found: error

  # ---- 6. the only release writer -----------------------------------------
  # The single condition under which a GitHub Release may be created, edited or
  # uploaded to. `workflow_dispatch` cannot satisfy it - its ref is a branch and
  # its event is not `push` - so no input combination reaches this job.
  # tests/_test_release_assets.py pins that, and proves the check has teeth.
  write-draft:
    name: write draft release
    needs: [version, gate, draft-preview]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Refuse to write a release without the full matrix
        # Belt and braces next to the gate job: the requirement is stated where
        # the mutation happens, so no later reshuffle of `needs` can drop it.
        run: |
          if ('${{ needs.gate.outputs.matrix }}' -ne 'full') { throw '没有完整矩阵授权，拒绝发布' }
      - name: Verify the checksums against the assets about to be uploaded
        # The list has to describe the final artifacts, so it is checked here
        # against the files this job just downloaded rather than trusted.
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "校验失败: $name" }
          }
      - name: Create or update the Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $title = $env:TAG
          $flags = @()
          if ('${{ needs.version.outputs.rehearsal }}' -eq 'true') {
            $title += '（演练）'
            $flags += '--prerelease'
          }
          $release = gh release view "$env:TAG" --json isDraft 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if (-not $release.isDraft) { throw '该版本已经发布，拒绝修改' }
            gh release edit "$env:TAG" --draft @flags --title "$title" --notes-file dist/release-body.md
          } else {
            gh release create "$env:TAG" --draft @flags --title "$title" --notes-file dist/release-body.md
          }
          if ($LASTEXITCODE -ne 0) { throw '草稿创建或更新失败' }
          $assets = @(Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName })
          gh release upload "$env:TAG" @assets dist/SHA256SUMS --clobber
      - name: Prove the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view "$env:TAG" --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Release 不是草稿' }
          foreach ($name in @('workbuddy2api-hub-v${{ needs.version.outputs.version }}.zip', 'SHA256SUMS')) {
            if ($name -notin $release.assets.name) { throw "草稿缺少资产: $name" }
          }
          Write-Host '草稿和资产校验通过，等待维护者发布。'
